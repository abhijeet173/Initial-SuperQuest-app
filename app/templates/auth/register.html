{% extends 'base.html' %}{% block content %}<section class="auth-layout wrap"><div class="auth-aside"><p class="eyebrow">NEW RECRUIT // 001</p><h1>Make your<br>mark.</h1><p>Every great hero starts with one decision.</p><div class="aside-stamp">SQ / ENLISTMENT</div></div><form method="post" class="form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">JOIN THE TEAM</p><h2>Create your account</h2><label>Hero name<input name="username" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" required></label><label>Email<input type="email" name="email" autocomplete="email" maxlength="254" required></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label><label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required></label><button class="button button-primary button-full">Create hero profile <span>↗</span></button><p class="form-foot">Already enlisted? <a href="{{ url_for('auth.login') }}">Log in</a></p></form></section>{% endblock %}
