{% extends 'base.html' %}{% block content %}<section class="wrap page-section"><div class="page-heading"><p class="eyebrow">LOADOUT // {{ powers|length }} POWER SYSTEMS</p><h1>Choose your <span>edge.</span></h1><p class="muted">Your power changes how mission performance is scored. Select one before launching.</p></div><form method="post" action="{{ url_for('main.select_power') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="power-grid">{% for power in powers %}<label class="power-card {% if current_user.selected_power_id == power.id %}power-selected{% endif %}"><input type="radio" name="power_id" value="{{ power.id }}" {% if current_user.selected_power_id == power.id %}checked{% endif %} required><span class="power-icon">{% if power.icon == 'shield' %}⬡{% elif power.icon == 'speed' %}➤{% elif power.icon == 'strength' %}✳{% elif power.icon == 'element' %}◈{% else %}⌘{% endif %}</span><span class="power-name">{{ power.name }}</span><span class="power-desc">{{ power.description }}</span><span class="power-effect">EFFECT / {{ power.effect }}</span></label>{% endfor %}</div><button class="button button-primary">Confirm loadout <span>↗</span></button></form></section>{% endblock %}
