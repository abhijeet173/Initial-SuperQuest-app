services:
  - type: web
    name: superquest
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: superquest-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: superquest-db
    databaseName: superquest
    user: superquest